plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
def hasProductionSigning = signingPropertiesFile.exists()
if (hasProductionSigning) {
  signingPropertiesFile.withInputStream { signingProperties.load(it) }
  ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
    if (!signingProperties.getProperty(key)) {
      throw new GradleException("signing.properties içinde zorunlu '$key' alanı eksik.")
    }
  }
}

android {
  namespace 'com.app.apkcleanermanager'
  compileSdk 36

  defaultConfig {
    applicationId 'com.app.apkcleanermanager'
    minSdk 26
    targetSdk 36
    versionCode 4
    versionName '1.4.0'
  }

  signingConfigs {
    production {
      if (hasProductionSigning) {
        storeFile rootProject.file(signingProperties.getProperty('storeFile'))
        storePassword signingProperties.getProperty('storePassword')
        keyAlias signingProperties.getProperty('keyAlias')
        keyPassword signingProperties.getProperty('keyPassword')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      signingConfig hasProductionSigning ? signingConfigs.production : signingConfigs.debug
    }
  }

  packaging {
    resources {
      excludes += [
        'META-INF/DEPENDENCIES',
        'META-INF/LICENSE',
        'META-INF/LICENSE.txt',
        'META-INF/NOTICE',
        'META-INF/NOTICE.txt',
        'META-INF/*.kotlin_module',
      ]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation('androidx.core:core:1.15.0') {
    exclude group: 'com.google.guava', module: 'listenablefuture'
  }
  implementation fileTree(dir: 'libs', include: ['*.jar'])
}
